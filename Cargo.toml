[package]
name = "rustyshot"
version = "0.3.11"
edition = "2024"
description = "Fast, lightweight, cross-platform screenshot, screen recorder & annotation tool written in pure Rust"
license = "MIT"

[dependencies]
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.30"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
arboard = { version = "3.4", features = ["wayland-data-control"] }
global-hotkey = "0.10"
tray-icon = "0.26"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
dirs = "5.0"
suppaftp = { version = "6", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
openh264 = "0.9"
mp4 = "0.14"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
strip = true
lto = "thin"
opt-level = 3
