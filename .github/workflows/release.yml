name: Build & Release Multi-Platform

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rustyshot.exe
          - name: Ubuntu x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rustyshot
          - name: macOS Apple Silicon (arm64)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rustyshot
          - name: macOS Intel (x64)
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rustyshot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgbm-dev \
            libdbus-1-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests (Linux)
        if: runner.os == 'Linux'
        run: cargo test --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" != v* ]]; then
            TAG="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          mkdir -p dist

          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "target/${{ matrix.target }}/release/rustyshot.exe" "dist/RustyShot-${TAG}-windows-x86_64.exe"
          elif [[ "${{ matrix.target }}" == *"linux"* ]]; then
            strip "target/${{ matrix.target }}/release/rustyshot" || true
            cp "target/${{ matrix.target }}/release/rustyshot" "dist/RustyShot-${TAG}-ubuntu-x86_64"
            chmod +x "dist/RustyShot-${TAG}-ubuntu-x86_64"
          elif [[ "${{ matrix.target }}" == *"aarch64-apple-darwin"* ]]; then
            strip "target/${{ matrix.target }}/release/rustyshot" || true
            cp "target/${{ matrix.target }}/release/rustyshot" "dist/RustyShot-${TAG}-macos-arm64"
            chmod +x "dist/RustyShot-${TAG}-macos-arm64"
            tar -czf "dist/RustyShot-${TAG}-macos-arm64.tar.gz" -C dist "RustyShot-${TAG}-macos-arm64"
            rm -f "dist/RustyShot-${TAG}-macos-arm64"
          elif [[ "${{ matrix.target }}" == *"x86_64-apple-darwin"* ]]; then
            strip "target/${{ matrix.target }}/release/rustyshot" || true
            cp "target/${{ matrix.target }}/release/rustyshot" "dist/RustyShot-${TAG}-macos-x86_64"
            chmod +x "dist/RustyShot-${TAG}-macos-x86_64"
            tar -czf "dist/RustyShot-${TAG}-macos-x86_64.tar.gz" -C dist "RustyShot-${TAG}-macos-x86_64"
            rm -f "dist/RustyShot-${TAG}-macos-x86_64"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustyshot-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat <<EOF > release_notes.md
          # RustyShot ${TAG}

          **Tác giả:** Long kakaka (longanhvn)

          Phần mềm chụp ảnh, quay màn hình và chú thích đa nền tảng viết bằng Rust, gọn nhẹ, 100% portable.

          ## Danh sách bản build đa nền tảng
          - **Windows (x64):** \`RustyShot-${TAG}-windows-x86_64.exe\`
          - **Ubuntu / Linux (x64):** \`RustyShot-${TAG}-ubuntu-x86_64\`
          - **macOS Apple Silicon (arm64):** \`RustyShot-${TAG}-macos-arm64.tar.gz\`
          - **macOS Intel (x64):** \`RustyShot-${TAG}-macos-x86_64.tar.gz\`

          ## Chi tiết thay đổi (CHANGELOG)
          EOF
          cat CHANGELOG.md >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "RustyShot ${{ github.ref_name }}"
          body_path: release_notes.md
          files: artifacts/*
          draft: false
          prerelease: false
